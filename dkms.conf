PACKAGE_NAME="sb-ae9"
PACKAGE_VERSION="0.2.0-preview11-voice2"
AUTOINSTALL="yes"
BUILD_EXCLUSIVE_KERNEL="^7[.][0-3][.]"
BUILD_EXCLUSIVE_ARCH="^x86_64$"
BUILT_MODULE_NAME[0]="snd-hda-core"
BUILT_MODULE_LOCATION[0]="driver/hda-core"
DEST_MODULE_LOCATION[0]="/updates"
BUILT_MODULE_NAME[1]="snd-hda-codec-ca0132"
BUILT_MODULE_LOCATION[1]="driver/ca0132"
DEST_MODULE_LOCATION[1]="/updates"
MAKE[0]="make KERNEL_RELEASE='${kernelver}' KDIR='${kernel_source_dir}'"
CLEAN="make clean KERNEL_RELEASE='${kernelver}' KDIR='${kernel_source_dir}'"
PRE_INSTALL="install/desktop-hook check"
POST_INSTALL="install/desktop-hook install ${kernelver} ${PACKAGE_VERSION}"
POST_REMOVE="install/desktop-hook remove ${kernelver} ${PACKAGE_VERSION}"
