# WirePlumber 0.5 configuration; 0.4 uses the corresponding Lua fragment.
monitor.alsa.rules = [
  { matches = [ { device.profile-set = "sb-ae9.conf" } ]
    actions = { update-props = {
      api.alsa.use-acp = true
      api.alsa.use-ucm = false
    } }
  }
  { matches = [ { device.profile.name = "sb-ae9-what-u-hear" } ]
    actions = { update-props = {
      node.disabled = false
      node.description = "AE-9 What U Hear"
      node.nick = "What U Hear"
      priority.session = 100
      priority.driver = 100
      audio.rate = 48000
      audio.format = "S32LE"
    } }
  }
]
